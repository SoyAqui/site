name: Deploy HTML Site to Timeweb

on:
  push:
    branches:
      - main # Если у вас ветка называется master, поменяйте на master

jobs:
  deploy:
    name: Upload Files
    runs-on: ubuntu-latest

    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        
        # Автоматический путь к папке сайта на сервере Timeweb
        server-dir: /home/c/w/cw411091/site_apostolandrey/public_html/
        
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/README.md
